[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presidio-hardened-vol-assign"
version = "0.3.0"
description = "Multi-objective post-disaster assignment: ED volunteer staffing (Rabiei et al., ESWA 2023) and humanitarian people-to-centre allocation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "scikit-fuzzy>=0.4",
    "scipy>=1.10",
    "networkx>=3.0",
    "deap>=1.4",
    # deap 1.4 wheels ship without the compiled deap.tools._hypervolume module,
    # so metrics.py falls back to pymoo's hypervolume. That fallback is on the
    # import path of every CLI command and must always be installable.
    "pymoo>=0.6",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.scripts]
pva = "presidio_vol_assign.cli:app"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]
crypto = [
    # Optional: enables Ed25519-signed evidence records. HMAC-SHA256 signing and
    # verification work stdlib-only without this extra.
    "cryptography>=42",
]
web = [
    # Optional: the `pva serve` demo GUI. presidio-hardened-fastapi pulls in
    # fastapi + uvicorn and applies the family security defaults (locked CORS,
    # security headers, per-IP rate limiting) on construction.
    "presidio-hardened-fastapi>=0.2",
    "pydantic>=2.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "ruff>=0.4",
    "pip-audit",
    "matplotlib>=3.7",
    "cryptography>=42",
    "presidio-hardened-fastapi>=0.2",
    "pydantic>=2.0",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_vol_assign"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Tests that run the full-size FIS precompute / benchmark instances.
    # Skip locally with: pytest -m "not slow"
    "slow: marks slower end-to-end tests (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    # scikit-fuzzy uses a numpy 2.x-deprecated positional arg in np.maximum/minimum
    "ignore::DeprecationWarning:skfuzzy",
]
