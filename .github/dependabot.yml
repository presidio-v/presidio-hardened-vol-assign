version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # init and analyze are sub-actions of one repo and must stay pinned to
      # the same SHA; without this they arrive as separate PRs (see #36, #37).
      codeql-action:
        patterns:
          - "github/codeql-action*"
