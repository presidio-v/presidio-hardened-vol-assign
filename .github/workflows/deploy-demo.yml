name: Deploy demo to STRATO

# Builds the static demo (`pva build-demo`) and mirrors it to the STRATO
# webspace folder served by pva.presidio-group.eu.
#
# The demo is a *static* build: every slider combination is pre-solved in CI, so
# the hosted page needs no Python runtime. Solving the whole compact grid in one
# job overran a 60-minute limit on a two-core runner, so the grid is sharded
# across parallel jobs and the pieces are recombined before upload. Each shard
# writes the full page, config and .htaccess plus its own slice of runs/, so
# overlaying the shards yields a complete site.
#
# Requires three repository secrets: STRATO_SFTP_HOST, STRATO_SFTP_USER and
# STRATO_SFTP_PASS.
#
# The host and username are secrets rather than literals because this repository
# is public, unlike presidio-web / stantchev-web where the same deploy pattern
# keeps them inline. Publishing an SFTP endpoint plus its username hands out half
# a credential pair for a webspace that serves several sites.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy demo" to confirm'
        required: true
        default: ''
      grid:
        description: 'Grid density: compact or full'
        required: false
        default: 'compact'

concurrency:
  group: strato-deploy-pva
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Guard confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy demo" ]; then
            echo "Confirmation string did not match. Aborting."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Install project
        run: uv sync --extra web

      - name: Build shard ${{ matrix.shard }} of 4
        run: |
          GRID="${{ github.event.inputs.grid }}"
          uv run pva build-demo \
            --output ./dist-demo \
            --grid "${GRID:-compact}" \
            --shard "${{ matrix.shard }}/4"

      - name: Report shard size
        run: |
          echo "runs in this shard: $(find ./dist-demo/runs -name '*.json' | wc -l)"
          du -sh ./dist-demo

      - name: Upload shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-shard-${{ matrix.shard }}
          path: ./dist-demo
          retention-days: 1
          if-no-files-found: error
          # Without this the generated .htaccess is silently dropped, and the
          # site deploys with no compression and no cache headers.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download every shard into one tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: demo-shard-*
          merge-multiple: true
          path: ./dist-demo

      - name: Sanity-check the merged build
        run: |
          test -f ./dist-demo/index.html
          test -f ./dist-demo/config.json
          test -f ./dist-demo/.htaccess
          grep -q 'content="static"' ./dist-demo/index.html

          # Every slider position named in config.json must have a run file, or
          # visitors would hit a 404 on a combination the page offers.
          python3 - <<'PY'
          import itertools, json, pathlib, sys
          root = pathlib.Path("dist-demo")
          cfg = json.loads((root / "config.json").read_text())
          missing = []
          expected = 0
          for scenario in cfg["scenarios"]:
              lists = [k["values"] for k in scenario["knobs"]]
              for combo in itertools.product(*(range(len(v)) for v in lists)):
                  for si in range(len(cfg["seeds"])):
                      expected += 1
                      key = "-".join(map(str, combo)) + f"__s{si}"
                      if not (root / "runs" / scenario["id"] / f"{key}.json").is_file():
                          missing.append(f"{scenario['id']}/{key}")
          print(f"expected {expected} run files")
          if missing:
              print(f"MISSING {len(missing)}; first few: {missing[:5]}")
              sys.exit(1)
          print("every advertised slider position has a run file")
          PY

          echo "total size: $(du -sh ./dist-demo | cut -f1)"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Check deploy credentials are configured
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASS }}
        run: |
          missing=""
          [ -n "$SFTP_HOST" ] || missing="$missing STRATO_SFTP_HOST"
          [ -n "$SFTP_USER" ] || missing="$missing STRATO_SFTP_USER"
          [ -n "$SFTP_PASS" ] || missing="$missing STRATO_SFTP_PASS"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Deploy dist-demo/ to /prod-pva via SFTP
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASS }}
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASS" "sftp://$SFTP_HOST" <<'EOF'
            set sftp:auto-confirm yes
            set sftp:connect-program "ssh -a -x -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new"
            set net:max-retries 2
            set net:timeout 30
            mirror --reverse --delete --verbose --parallel=4 ./dist-demo /prod-pva
            bye
          EOF
