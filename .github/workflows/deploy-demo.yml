name: Deploy demo to STRATO

# Builds the static demo (`pva build-demo`) and mirrors it to the STRATO
# webspace folder served by pva.presidio-group.eu.
#
# The demo is a *static* build: every slider combination is pre-solved here in
# CI, so the hosted page needs no Python runtime. Solving the compact grid takes
# roughly ten minutes on a GitHub runner.
#
# Requires the repository secret STRATO_SFTP_PASS (same value as the one used by
# the presidio-web / stantchev-web repositories).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy demo" to confirm'
        required: true
        default: ''
      grid:
        description: 'Grid density: compact or full'
        required: false
        default: 'compact'

concurrency:
  group: strato-deploy-pva
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Guard confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy demo" ]; then
            echo "Confirmation string did not match. Aborting."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install project
        run: uv sync --extra web

      - name: Build the static demo
        run: |
          GRID="${{ github.event.inputs.grid }}"
          uv run pva build-demo --output ./dist-demo --grid "${GRID:-compact}"

      - name: Report build size
        run: |
          echo "runs: $(find ./dist-demo/runs -name '*.json' | wc -l)"
          du -sh ./dist-demo

      - name: Sanity-check the build
        run: |
          test -f ./dist-demo/index.html
          test -f ./dist-demo/config.json
          grep -q 'content="static"' ./dist-demo/index.html
          # A page still pointing at the live API would 404 on static hosting.
          ! grep -q '"/api/run"' ./dist-demo/config.json

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy dist-demo/ to /prod-pva via SFTP
        env:
          SFTP_HOST: 5258188.ssh.w1.strato.hosting
          SFTP_USER: stu138646248
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASS }}
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASS" "sftp://$SFTP_HOST" <<'EOF'
            set sftp:auto-confirm yes
            set sftp:connect-program "ssh -a -x -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new"
            set net:max-retries 2
            set net:timeout 30
            mirror --reverse --delete --verbose --parallel=4 ./dist-demo /prod-pva
            bye
          EOF
