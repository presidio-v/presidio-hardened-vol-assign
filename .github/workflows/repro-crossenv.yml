name: Cross-env reproducibility (Paper B RQ2)

# Runs the allocation-front reproducibility signatures on a matrix of OS/Python and
# compares them across environments (RQ2). Divergence is reported, not gated.

on:
  workflow_dispatch:
  push:
    branches: [paper/systems-turbulence]
    paths:
      - "src/presidio_vol_assign/allocation/**"
      - "experiments/run_reproducibility.py"
      - "experiments/compare_repro.py"
      - ".github/workflows/repro-crossenv.yml"

jobs:
  signatures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Reproducibility signatures
        run: uv run python -m experiments.run_reproducibility --sizes small --reps 5 --pop-size 60 --generations 60
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.os }}-${{ matrix.python-version }}
          path: experiments/results/repro/repro_manifest.csv

  compare:
    needs: signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download all manifests
        uses: actions/download-artifact@v4
        with:
          path: crossenv
      - name: Compare signatures across environments
        run: python3 experiments/compare_repro.py crossenv
      - name: Upload cross-env summary
        uses: actions/upload-artifact@v4
        with:
          name: cross-env-repro-summary
          path: crossenv/cross_env_repro.csv
