name: Cross-env reproducibility (allocation model)

# Runs the allocation-front reproducibility signatures on a matrix of OS/Python and
# compares them across environments (RQ2). Divergence is reported, not gated.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/presidio_vol_assign/allocation/**"
      - "experiments/run_reproducibility.py"
      - "experiments/compare_repro.py"
      - ".github/workflows/repro-crossenv.yml"

permissions:
  contents: read

jobs:
  signatures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Reproducibility signatures
        run: uv run python -m experiments.run_reproducibility --sizes small,large --reps 5 --pop-size 100 --generations 150
      - name: Upload manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-${{ matrix.os }}-${{ matrix.python-version }}
          path: experiments/results/repro/repro_manifest.csv

  compare:
    needs: signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: crossenv
      - name: Compare signatures across environments
        run: python3 experiments/compare_repro.py crossenv
      - name: Upload cross-env summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-env-repro-summary
          path: crossenv/cross_env_repro.csv
