name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Test
        run: uv run pytest --cov=presidio_vol_assign --cov-fail-under=80

      - name: Dependency audit
        # Python 3.10 has no fixed pillow release; it ignores only the advisories
        # listed in .github/pip-audit-py310-ignore.txt. Other legs ignore nothing.
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          ignore=()
          if [ "$PY_VERSION" = "3.10" ]; then
            while read -r id; do
              case "$id" in ""|"#"*) continue ;; esac
              ignore+=(--ignore-vuln "$id")
            done < .github/pip-audit-py310-ignore.txt
          fi
          uv run pip-audit "${ignore[@]}"
