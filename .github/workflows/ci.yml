name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Test
        run: uv run pytest --cov=presidio_vol_assign --cov-fail-under=80

      - name: Dependency audit
        run: uv run pip-audit

  # Single required check for branch protection: it stays named `ci-ok` whatever
  # the Python matrix is, so adding or dropping a version never strands a PR on a
  # required check that no longer reports. Require this, not the matrix legs.
  ci-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to have passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix result: $RESULT"
          test "$RESULT" = "success"
